<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Dr.Judge · 내 정보 수정</title>
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="tabs.css" />
    <link rel="stylesheet" href="judge.css" />
    <link rel="stylesheet" href="mypage.css" />
    <link rel="stylesheet" href="edit.css" />
  </head>
  <body>
    <div class="app tabpage editpage">
      <!-- 1. 뒤로가기 → 마이페이지 -->
      <header class="subhead">
        <a href="./mypage.html" class="subhead__back" aria-label="뒤로">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 5-7 7 7 7" />
          </svg>
        </a>
        <h1 class="subhead__title">내 정보 수정</h1>
      </header>

      <div class="scroll-area">
        <!-- 1·2. 프로필 사진 -->
        <section class="avatarbox">
          <span class="avatarbox__img" id="avatarImg"></span>
          <button type="button" class="avatarbox__cam" id="camBtn" aria-label="사진 변경" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M9.4 4.5 8.3 6H5.5A2.5 2.5 0 0 0 3 8.5v9A2.5 2.5 0 0 0 5.5 20h13a2.5 2.5 0 0 0 2.5-2.5v-9A2.5 2.5 0 0 0 18.5 6h-2.8l-1.1-1.5H9.4ZM12 16.6a4.1 4.1 0 1 1 0-8.2 4.1 4.1 0 0 1 0 8.2Z" />
            </svg>
          </button>

          <!-- 2-1. 사진 보관함 / 파일 선택 팝업 -->
          <div class="photomenu" id="photoMenu" hidden>
            <button type="button" class="photomenu__item" data-pick="album">
              사진 보관함
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3.5" y="5" width="17" height="14" rx="2.5" />
                <path d="m5 17 4.5-5 3 3.5L16 12l3 4" />
                <circle cx="9" cy="9.5" r="1.3" />
              </svg>
            </button>
            <button type="button" class="photomenu__item" data-pick="file">
              파일 선택
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3.5 7.5A1.5 1.5 0 0 1 5 6h4l2 2h6a1.5 1.5 0 0 1 1.5 1.5v7A1.5 1.5 0 0 1 17 18H5a1.5 1.5 0 0 1-1.5-1.5v-9Z" />
              </svg>
            </button>
          </div>

          <input type="file" id="albumInput" accept="image/*" hidden />
          <input type="file" id="fileInput" hidden />
        </section>

        <section class="fieldlist">
          <!-- 3. 닉네임 → 닉네임 변경 -->
          <a href="./nickname-edit.html" class="fieldrow fieldrow--link">
            <span class="fieldrow__text">
              <span class="fieldrow__label">닉네임</span>
              <b class="fieldrow__value" id="nickValue">마라탕후루이비똥</b>
            </span>
            <span class="fieldrow__arrow" aria-hidden="true"></span>
          </a>

          <div class="fieldrow">
            <span class="fieldrow__text">
              <span class="fieldrow__label">학번</span>
              <b class="fieldrow__value" id="stuValue">2022147034</b>
            </span>
          </div>

          <div class="fieldrow">
            <span class="fieldrow__text">
              <span class="fieldrow__label">이메일</span>
              <b class="fieldrow__value" id="mailValue">tmxhdjf12@g.eulji.ac.kr</b>
            </span>
          </div>
        </section>
      </div>

      <nav class="tabbar" data-active="my"></nav>
    </div>

    <script src="common.js"></script>
    <script src="data.js"></script>
    <script src="profile-edit.js"></script>
  </body>
</html>
