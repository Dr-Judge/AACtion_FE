<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Dr.Judge · 시작하기</title>
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <div class="app auth auth--start">
      <main class="auth__hero">
        <img
          class="auth__character"
          src="./assets/character.png"
          alt="Dr.Judge 캐릭터"
          data-fallback="character"
        />
        <img
          class="auth__wordmark"
          src="./assets/wordmark.png"
          alt="Dr.Judge"
          data-fallback="wordmark"
        />
      </main>

      <footer class="auth__cta">
        <!-- 학술제·시연용: 가입 없이 체험 계정으로 바로 들어갑니다(demo-btn.js) -->
        <button
          type="button"
          class="btn btn--block btn--lg btn--primary"
          id="demoBtn"
        >
          체험하기
        </button>

        <p class="auth__or"><span>또는</span></p>

        <a href="./signup.html" class="btn btn--block btn--lg btn--outline">
          회원가입
        </a>

        <!-- 카카오 로그인은 이번 행사에서 키가 없어 숨겼습니다.
             키를 받으면 아래 주석을 풀고(위 '또는' 아래에 두면 됩니다) api.js 의
             KAKAO_CLIENT_ID 를 채우세요. kakao-btn.js 는 버튼이 없으면 아무 일도 하지 않습니다.
        <button
          type="button"
          class="btn btn--block btn--lg btn--kakao"
          id="kakaoBtn"
        >
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M12 3.6c-4.7 0-8.5 2.9-8.5 6.5 0 2.3 1.6 4.4 4 5.6l-.9 3.4c-.1.3.3.5.5.3l4-2.6c.3 0 .6.1.9.1 4.7 0 8.5-2.9 8.5-6.5S16.7 3.6 12 3.6Z"
            />
          </svg>
          카카오로 계속하기
        </button>
        -->

        <p class="auth__switch">
          이미 계정이 있으신가요?
          <a href="./login.html" class="auth__switch-link">로그인</a>
        </p>
      </footer>
    </div>

    <script src="common.js"></script>
    <script src="store.js"></script>
    <script src="data.js"></script>
    <script src="api.js"></script>
    <script src="demo-btn.js"></script>
    <script src="kakao-btn.js"></script>
  </body>
</html>
