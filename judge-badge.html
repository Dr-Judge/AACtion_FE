<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Dr.Judge · 이해상충 배지</title>
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="tabs.css" />
    <link rel="stylesheet" href="judge.css" />
    <link rel="stylesheet" href="mypage.css" />
    <link rel="stylesheet" href="result.css" />
  </head>
  <body>
    <div class="app tabpage resultpage">
      <header class="subhead">
        <a href="./judge-result.html" class="subhead__back" aria-label="뒤로">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 5-7 7 7 7" />
          </svg>
        </a>
        <h1 class="subhead__title">이해상충 배지</h1>
      </header>

      <div class="scroll-area">
        <section class="result2">
          <h2 class="sect__title">이해상충</h2>
          <p class="sect__body">상업적 이해가 있는 주장</p>

          <section class="sect">
            <div class="sect__card">
              <dl class="deflist">
                <dt>정의</dt>
                <dd>
                  제품을 판매하거나 광고하는 회사·개인이 해당 제품의 효과를
                  주장하는 경우입니다.
                </dd>
                <dt>판정 근거</dt>
                <dd>
                  판정 엔진이 입력 출처를 분석해 상업적 목적 여부를 검출합니다.
                  의약품·건강기능식품 판매 채널, 광고성 게시물, 협찬 표기 등이
                  판단 기준입니다.
                </dd>
              </dl>
            </div>
          </section>

          <section class="sect">
            <div class="notice-card">
              <h2 class="notice-card__title">주의 안내</h2>
              <p>
                상업적 의도가 있다고 해서 내용이 거짓이라는 뜻은 아닙니다.
                다만 판매자 입장에서 유리한 정보만 강조될 수 있으니, 같은 주장을
                중립 출처의 근거와 함께 확인하는 것이 좋습니다.
              </p>
            </div>
          </section>
        </section>
      </div>

      <div class="pagecta">
        <a href="./judge-result.html" class="btn btn--lg btn--ghost">돌아가기</a>
      </div>
    </div>

    <script src="common.js"></script>
    <script src="data.js"></script>
  </body>
</html>
